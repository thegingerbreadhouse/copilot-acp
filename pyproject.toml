[project]
name = "copilot-acp"
version = "0.1.0"
description = "Thin Python wrapper for driving GitHub Copilot CLI over ACP."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "agent-client-protocol>=0.9.0,<1.0.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
copilot-acp = "copilot_acp.__main__:main"
copilot-acp-once = "copilot_acp.examples.run_once:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
